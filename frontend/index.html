<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>한국어 자막 생성기</title>
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
  <header class="app-header">
    <h1>한국어 자막 생성기</h1>
    <p class="subtitle">영상을 선택하면 로컬 Whisper가 한국어 자막을 만들어 드려요.</p>
  </header>

  <section class="card" id="upload-card">
    <div class="picker-row">
      <button id="pick-file-btn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        파일 선택
      </button>
      <button id="upload-file-btn" class="btn btn-secondary">🎤 음성/영상 파일 업로드</button>
      <input type="file" id="upload-file-input" accept=".m4a,.wav,.mp3,.mp4,.mov,.mkv,.webm" hidden>
      <span id="picked-path" class="picked-path">선택된 파일이 없습니다</span>
      <button id="start-btn" class="btn btn-primary" disabled>자막 생성 시작</button>
      <button id="extract-audio-btn" class="btn btn-secondary" disabled>오디오만 추출 (다른 기기로 전송용)</button>
      <button id="history-btn" class="btn btn-secondary">🕘 작업 히스토리</button>
    </div>

    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="progress-label">
        <span id="progress-message">대기 중</span>
        <span id="progress-percent">0%</span>
      </div>
    </div>

    <div id="history-panel" class="history-panel" hidden>
      <div id="history-list" class="history-list"></div>
    </div>
  </section>

  <section id="workspace" class="workspace" hidden>
    <div class="video-pane card">
      <div class="video-wrap">
        <video id="player" controls></video>
        <div id="caption-overlay" class="caption-overlay"></div>
      </div>
      <div class="toolbar">
        <div class="speed-group">
          <button class="btn btn-secondary speed-btn active" data-speed="1">1x</button>
          <button class="btn btn-secondary speed-btn" data-speed="2">2x</button>
          <button class="btn btn-secondary speed-btn" data-speed="3">3x</button>
          <button class="btn btn-secondary speed-btn" data-speed="4">4x</button>
        </div>
        <button id="save-btn" class="btn btn-primary">자막 저장</button>
        <a id="download-link" class="btn btn-secondary" href="#" download>SRT 다운로드</a>
        <button id="next-flag-btn" class="btn btn-warning">⚠ 다음 확인 필요 구간</button>
        <button id="delete-repeat-btn" class="btn btn-warning">🗑 반복 구간 일괄삭제</button>
        <button id="undo-btn" class="btn btn-secondary" disabled title="실행 취소 (Ctrl+Z)">↶ 실행 취소</button>
        <button id="redo-btn" class="btn btn-secondary" disabled title="다시 실행 (Ctrl+Shift+Z)">↷ 다시 실행</button>
        <span id="save-status" class="save-status"></span>
      </div>

      <div class="style-panel">
        <div class="style-row">
          <label>글자 크기<input type="range" id="style-size" min="20" max="60" value="32"><span id="style-size-val">32</span></label>
          <label>글자 색<input type="color" id="style-color" value="#ffffff"></label>
          <label>테두리 색<input type="color" id="style-outline-color" value="#000000"></label>
          <label>자막 폭<input type="range" id="style-width" min="40" max="100" value="90"><span id="style-width-val">90</span>%</label>
        </div>
        <div class="style-row">
          <label>위치
            <select id="style-position">
              <option value="bottom">하단</option>
              <option value="middle">중앙</option>
              <option value="top">상단</option>
            </select>
          </label>
          <label>여백<input type="range" id="style-margin" min="10" max="200" value="70"><span id="style-margin-val">70</span></label>
        </div>
        <div class="style-row">
          <button id="burn-pick-btn" class="btn btn-secondary">📁 구울 영상 파일 선택</button>
          <span id="burn-source-path" class="picked-path">선택된 파일이 없습니다</span>
          <button id="burn-btn" class="btn btn-primary" disabled>🔥 이 스타일로 영상에 굽기</button>
          <button id="burn-cancel-btn" class="btn btn-warning" hidden>⏹ 굽기 중지</button>
        </div>
        <div id="burn-progress-wrap" class="progress-wrap" hidden>
          <div class="progress-track"><div id="burn-progress-fill" class="progress-fill"></div></div>
          <div class="progress-label">
            <span id="burn-progress-message">대기 중</span>
            <span id="burn-progress-percent">0%</span>
          </div>
        </div>
      </div>
    </div>
    <div class="subtitle-pane card">
      <div class="toolbar-sticky">
        <div class="replace-row">
          <input type="text" id="find-input" class="replace-input" placeholder="찾을 단어">
          <button id="find-next-btn" class="btn btn-secondary">🔍 찾기</button>
          <input type="text" id="replace-input" class="replace-input" placeholder="바꿀 단어">
          <button id="replace-all-btn" class="btn btn-secondary">전체 바꾸기</button>
          <button id="next-changed-btn" class="btn btn-warning" hidden>🟡 다음 변경 위치</button>
          <span id="replace-status" class="save-status"></span>
        </div>
        <div class="sync-row">
          <span id="current-time-display" class="current-time-display">현재 0:00.0</span>
          <span id="sync-selected-count" class="save-status">0개 선택됨</span>
          <input type="number" id="sync-offset-input" step="0.1" min="0" value="0.5" class="replace-input sync-offset-input">초
          <button id="sync-backward-btn" class="btn btn-secondary">◀ 앞으로 밀기</button>
          <button id="sync-forward-btn" class="btn btn-secondary">뒤로 밀기 ▶</button>
          <button id="sync-snap-btn" class="btn btn-primary">🎯 현재 위치에 맞추기</button>
          <button id="sync-select-to-end-btn" class="btn btn-secondary">▼ 여기부터 끝까지 선택</button>
          <button id="sync-clear-btn" class="btn btn-secondary">선택 해제</button>
        </div>
      </div>
      <div id="subtitle-list" class="subtitle-list"></div>
    </div>
  </section>

  <script src="app.js?v=31"></script>
</body>
</html>
